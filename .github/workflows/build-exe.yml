name: Buduj exe (Windows)

on:
  push:
    branches: [main, generator-arkuszy]
    tags: ["v*"]
    paths:
      - "generuj_arkusze.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ORIENTACJE_BEZ_PAUZY: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Budowanie GeneratorArkuszy.exe
        run: >
          pyinstaller --onefile --console --name GeneratorArkuszy
          --hidden-import PIL.Image --hidden-import PIL.JpegImagePlugin --hidden-import PIL.PngImagePlugin
          generuj_arkusze.py

      - name: Test 1 - lista źródeł
        run: dist\GeneratorArkuszy.exe --lista-zrodel

      - name: Test 2 - wszystkie stacje bez sieci
        shell: pwsh
        run: |
          dist\GeneratorArkuszy.exe szablon.dxf --wyniki test_offline --bez-podkladu --bez-geokodowania --nazwy nazwy_przyklad.csv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $n = (Get-ChildItem test_offline -Filter *.dxf).Count
          Write-Host "Plików DXF: $n"
          if ($n -ne 11) { exit 1 }
          if (-not (Test-Path test_offline\zestawienie_stacji.xlsx)) { exit 1 }

      - name: Test 3 - prawdziwy podkład i nazwy z internetu
        shell: pwsh
        run: |
          dist\GeneratorArkuszy.exe szablon.dxf --wyniki test_online --stacje 541,664 --cache test_cache
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem test_online | Format-Table Name, Length
          foreach ($nr in 541, 664) {
            $jpg = "test_online\${nr}_podklad.jpg"
            if (-not (Test-Path $jpg)) { Write-Host "Brak $jpg"; exit 1 }
            if ((Get-Item $jpg).Length -lt 20000) { Write-Host "Podejrzanie mały $jpg"; exit 1 }
          }

      - name: Test 4 - szablon bez obrazu rastrowego
        shell: pwsh
        run: |
          python -c "import generuj_arkusze as g; d=g.DxfDocument.load('szablon.dxf'); [d.tags.__setitem__(i, None) for h in ('986B','986C') for i in range(d.by_handle[h].start, d.by_handle[h].end)]; open('szablon_bez_obrazu.dxf','wb').write(d.to_bytes())"
          dist\GeneratorArkuszy.exe szablon_bez_obrazu.dxf --wyniki test_bez_obrazu --stacje 541 --cache test_cache
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path test_bez_obrazu\541_podklad.jpg)) { exit 1 }

      - name: Paczka
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paczka | Out-Null
          if (Test-Path dist\GeneratorArkuszy.exe) { Copy-Item dist\GeneratorArkuszy.exe paczka\ }
          Copy-Item README.md, nazwy_przyklad.csv paczka\

      - uses: actions/upload-artifact@v4
        with:
          name: GeneratorArkuszy
          path: paczka/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyniki-testow
          path: |
            test_online/
            test_bez_obrazu/

      - name: Wydanie (release) dla tagu
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeneratorArkuszy.exe
          body: |
            GeneratorArkuszy.exe - generator planów orientacyjnych stacji trafo.
            Połóż exe obok szablon.dxf i uruchom dwuklikiem (albo przeciągnij plik .dxf na ikonę).
            Wyniki: folder "wyniki" obok szablonu.
